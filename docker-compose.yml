# Everything runs in containers; the host only needs Docker. See README.md.
# The viewer service is called "web", not "app": Chromium forces HTTPS for any
# host named "app" (.app is an HSTS-preloaded top-level domain).
services:
  pipeline:
    build: { context: ., dockerfile: docker/pipeline.Dockerfile }
    image: cim-pipeline:dev
    user: "${UID:-1000}:${GID:-1000}"
    environment: { HOME: /tmp, USER: cim }  # snakemake needs a user name; the host UID has none in the image
    env_file: [{ path: .env, required: false }]  # MAPILLARY_TOKEN; never committed
    volumes: [".:/repo"]
    working_dir: /repo

  web:
    image: node:24-bookworm-slim
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      COREPACK_HOME: /repo/app/node_modules/.corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      npm_config_store_dir: /repo/app/node_modules/.pnpm-store
    volumes: [".:/repo"]
    working_dir: /repo/app
    ports: ["5173:5173"]
    command: sh -c "corepack pnpm install --frozen-lockfile && corepack pnpm dev --host 0.0.0.0"

  # Production build of the viewer, for sharing. Unlike the dev server it only
  # serves the built app and the tiles, not the rest of the repository.
  preview:
    image: node:24-bookworm-slim
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      COREPACK_HOME: /repo/app/node_modules/.corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      npm_config_store_dir: /repo/app/node_modules/.pnpm-store
    volumes: [".:/repo"]
    working_dir: /repo/app
    ports: ["4173:4173"]
    command: sh -c "corepack pnpm install --frozen-lockfile && corepack pnpm build && corepack pnpm preview --host 0.0.0.0 --port 4173"

  # Public URL via a Cloudflare quick tunnel (random *.trycloudflare.com address, no account).
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate --url http://preview:4173
    depends_on: [preview]

  eval:
    image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION:-1.63.0}-noble
    user: "${UID:-1000}:${GID:-1000}"
    environment: { HOME: /tmp, APP_URL: "http://web:5173" }
    volumes: [".:/repo"]
    working_dir: /repo/eval
    depends_on: [web]
