# Pipeline settings. Distances are meters.

# Local map frame: x = east, y = north, z = up, in meters, with the origin at
# State & Madison (the zero point of Chicago's street address grid).
# The ground is treated as flat in a transverse Mercator projection centered here;
# tilesets are georeferenced with an east-north-up transform at this point.
origin:
  name: State & Madison
  lat: 41.88202
  lon: -87.62780
  height: 147.0     # approx. ellipsoidal height of street level (WGS84)

# Region cut out of the Illinois extract: all of Chicago plus a margin (lon/lat).
city_bbox: [-87.95, 41.63, -87.51, 42.03]

# Elevations: local z = NAVD88 elevation - ground_datum, so street level at
# State & Madison is about 0. Lake Michigan and the river are drawn at water_level.
ground_datum: 181.0
water_level: 176.5

lidar:
  source: ept2017   # ept2017 (USGS 2017 EPT) or cook2022 (Cook County 2022 tiles); env CIM_LIDAR_SOURCE overrides
  depth: 9        # EPT octree depth to read; 9 is about 4 points/m², 10 is the full ~22
  cook2022_density: 8   # points/m² kept from each 2022 county tile (the files have ~100)
  cook2022_keep_las: false  # keep the 1.8 GB originals after converting (for debugging)
  cook2022_downloads: 4    # county tiles downloaded and converted at once (~1 GB of memory each)
  cook2022_margin: 250     # meters beyond the city that use 2022 tiles; farther out, 2017 fills in
  cook2022_workers: 2      # cap on blocks at once for every lidar step with 2022 data (4 ran out of memory in 32 GB)
  workers: 8      # blocks processed at once (each holds ~10M points, ~2-3 GB, in memory)
  min_density: 0.5  # points/m² inside a footprint needed to trust a lidar height

tiles:
  workers: 10           # blocks written at once (each ~2 GB)

roofs:
  workers: 5            # blocks reconstructed at once (each ~3 GB in Python plus ~2 GB in roofer)
  threads_per_block: 4  # roofer jobs within each block
  cook2022_density: 0   # thin the 2022 points for roofer to this many per m² (0: all 8). At 4/m²,
                        # 5% of an Old Town block's roofs overshot the lidar by >1 m; at 8, 1.3%
  cook2022_workers: 3   # blocks at once with the 2022 survey (~6 GB each with roofer)

# Square tiles on a fixed grid anchored 32 km southwest of the origin (see grid.py).
tile_size: 500

# Ground (streets, parks, water) is generated for every tile touching the area's
# bounding box, plus this many extra tiles around it, so lakes and parks continue
# past the area edge. Buildings are only placed inside the area itself.
ground_margin_tiles: 2

heights:
  meters_per_level: 3.5        # OSM building:levels
  meters_per_story: 3.8        # City of Chicago `stories`
  defaults:                    # used when no height data exists (by OSM building=*)
    garage: 3.0
    garages: 3.0
    shed: 3.0
    roof: 4.0
    house: 8.0
    detached: 8.0
    residential: 9.0
    apartments: 12.0
    commercial: 10.0
    retail: 6.0
    industrial: 10.0
    church: 15.0
    yes: 8.0
  default: 8.0
  small_footprint_m2: 40       # smaller than this and no data: assume a kiosk-sized structure
  small_footprint_height: 3.5
